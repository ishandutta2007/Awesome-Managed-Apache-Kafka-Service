<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Dynamic / Animated Background Stream Lines -->
  <g opacity="0.25">
    <path d="M-100,60 Q300,120 600,40 T1300,80" stroke="#06b6d4" stroke-width="2" fill="none">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M-100,60 Q300,120 600,40 T1300,80;
                M-100,80 Q300,40 600,100 T1300,50;
                M-100,60 Q300,120 600,40 T1300,80"/>
    </path>
    <path d="M-100,200 Q400,260 800,180 T1300,240" stroke="#8b5cf6" stroke-width="2" fill="none">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M-100,200 Q400,260 800,180 T1300,240;
                M-100,220 Q400,160 800,220 T1300,190;
                M-100,200 Q400,260 800,180 T1300,240"/>
    </path>
  </g>

  <!-- Animated Data Nodes / Streaming Particles -->
  <g opacity="0.6">
    <circle cx="150" cy="80" r="4" fill="#06b6d4">
      <animate attributeName="cx" values="100;1100;100" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;120;80" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="220" r="5" fill="#ec4899">
      <animate attributeName="cx" values="1100;100;1100" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;180;220" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle Kafka Ring Logo Dynamic Accent in Background Right -->
  <g transform="translate(950, 150)" opacity="0.15">
    <circle cx="0" cy="0" r="90" stroke="url(#accent-grad)" stroke-width="4" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-90" r="12" fill="#06b6d4"/>
    <circle cx="78" cy="45" r="12" fill="#3b82f6"/>
    <circle cx="-78" cy="45" r="12" fill="#8b5cf6"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 115)">
    <!-- Category Tag / Pill -->
    <rect x="0" y="-55" width="280" height="32" rx="16" fill="url(#pulse-grad)"/>
    <text x="140" y="-34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">DATA ENGINEERING &amp; EDA</text>

    <!-- Main Title -->
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" filter="url(#glow)">
      Awesome Managed Kafka
    </text>
    
    <!-- Accent Underline -->
    <rect x="0" y="32" width="520" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of Commercial Cloud Kafka &amp; Open-Source Event Streaming Engines
    </text>
  </g>
</svg>
